<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>母音ドリル</title>
<meta name="description" content="単語を見て母音を即答する『英語耳』式の大量ドリル">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="母音ドリル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#1d4ed8;--ok:#059669;--err:#dc2626;--warn:#d97706;--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--primary:#3b82f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:calc(1rem + var(--sb))}
button{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
h1,h2,h3{margin:0 0 .4rem;line-height:1.3}h1{font-size:1.2rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:.4rem 0}
.small{font-size:.85rem}.muted{color:var(--muted)}.center{text-align:center}.ok{color:var(--ok)}.err{color:var(--err)}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.between{justify-content:space-between}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + .6rem) 1rem .6rem;background:#1e40af;color:#fff}
header a{color:#fff;font-weight:700}
header .pill{font-size:.75rem;padding:.15rem .55rem;border-radius:999px;background:rgba(255,255,255,.2)}
main{max-width:640px;margin:0 auto;padding:.8rem}
.card{background:var(--card);border-radius:14px;padding:.9rem 1rem;margin-bottom:.8rem;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-height:44px;padding:.55rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:.35rem .7rem;font-size:.85rem}.btn.big{min-height:56px;font-size:1.1rem;padding:.7rem 1.4rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.4rem .8rem;min-height:38px;cursor:pointer;font-size:.9rem}
.seg button.on{background:var(--primary);color:#fff}
.field{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.field:last-of-type{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.stats .val{font-size:1.7rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chip{display:inline-flex;align-items:center;gap:.25rem;padding:.3rem .65rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.chip.warn{border-color:var(--warn)}.chip.sel{cursor:pointer;min-height:40px}
.tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto .2rem;max-width:320px}.tbar>div{height:100%;background:var(--warn);width:100%}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:.3rem 0}.progress>div{height:100%;background:var(--ok);transition:width .2s}
.word{font-size:2.8rem;font-weight:800;text-align:center;padding:1.1rem 0 .3rem;transition:color .15s}
.word.ok{color:var(--ok)}
.word.ng{color:var(--err)}
.hl{color:var(--err);font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.8rem 0 .4rem}.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{flex-direction:column;min-height:76px;gap:0;font-size:1.5rem;font-weight:500}
.choice .small{font-size:.72rem;font-weight:400;color:var(--muted)}
.choice.ok{background:#dcfce7;border-color:var(--ok);color:#14532d}.choice.ng{background:#fee2e2;border-color:var(--err);color:#7f1d1d}
.fb{min-height:1.8rem;text-align:center;font-size:1.05rem}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl td,.tbl th{text-align:left;padding:.35rem .3rem;border-bottom:1px solid var(--line)}.tbl th{color:var(--muted);font-weight:500}
.bars{display:flex;gap:.4rem;align-items:flex-end;height:90px}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}.bar{width:100%;background:var(--primary);opacity:.55;border-radius:4px 4px 0 0;min-height:2px}.bar.today{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);background:#111827;color:#fff;padding:.6rem 1rem;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:40;max-width:92vw;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--err)}#toast.ok{background:var(--ok)}
/* ミックス（カード）モード — mikan 風 */
:root{--mk:#f97316;--mk-soft:#fff7ed;--mk-line:#fed7aa}
@media(prefers-color-scheme:dark){:root{--mk-soft:#3a2410;--mk-line:#7c3d12}}
.mk-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.mk-ring{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;
  background:conic-gradient(var(--mk) calc(var(--p,0)*1%),var(--line) 0)}
.mk-ring>span{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.mk-meta{flex:1;min-width:0}
.mk-round{font-weight:700}
.mk-streak{color:var(--mk);font-weight:700}
.mk-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.6rem 1rem;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.07);transition:border-color .15s,background .15s,transform .12s}
.mk-card.ok{border-color:var(--ok);background:#f0fdf4}
.mk-card.ng{border-color:var(--err);background:#fef2f2}
@media(prefers-color-scheme:dark){.mk-card.ok{background:#052e1b}.mk-card.ng{background:#3f1010}}
.mk-card .word{padding:.2rem 0 .1rem}
.mk-tag{display:inline-block;font-size:.72rem;padding:.15rem .6rem;border-radius:999px;background:var(--mk-soft);
  border:1px solid var(--mk-line);color:var(--mk);font-weight:700}
.mk-choices{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.8rem 0 .3rem}
.mk-choices .choice{min-height:70px;border-radius:16px;border-width:2px}
.mk-why{background:var(--bg);border-radius:12px;padding:.55rem .7rem;margin-top:.5rem;text-align:left}
.mk-why b{color:var(--mk)}
.mk-done{font-size:2.4rem}
@media(min-width:640px){.word{font-size:3.4rem}}
</style>
</head>
<body>
<header><a href="#/">母音ドリル</a><span class="pill" id="online"></span></header>
<main id="main"><p class="muted center">読み込み中…</p></main>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
<noscript>このアプリには JavaScript が必要です。</noscript>
</body>
</html>
